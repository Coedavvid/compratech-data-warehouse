services:

  postgres:
    image: postgres:16
    container_name: compratech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: compratech
      POSTGRES_USER: compratech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: compratech-airflow
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: compratech
      POSTGRES_USER: compratech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      GCP_PROJECT_ID: compratech-data-warehouse
      BQ_DATASET_ID: raw_data
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/google/application_default_credentials.json

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ./data_generator:/opt/airflow/data_generator
      - ${APPDATA}/gcloud/application_default_credentials.json:/opt/airflow/google/application_default_credentials.json:ro

    command: >
      bash -c "
      airflow db migrate &&
      airflow api-server &
      airflow dag-processor &
      airflow scheduler
      "

volumes:
  postgres_data: